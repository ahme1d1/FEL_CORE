name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # `npm ci` runs `prepare`, so this builds the package the same way a consumer's install does.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
